# Attacca 리버스 프록시 — 1단계: IP + HTTP (도메인 없음)
#
#   브라우저 ──> Nginx(80) ──┬──> FE(Next.js :3000)   기본
#                            ├──> BE(:8080) /api/**
#                            ├──> BE(:8080) /files/** (storage.type=local일 때)
#                            └──> BE(:8080) /ws       WebSocket 업그레이드
#
# 도메인과 인증서가 준비되면 deploy/nginx.https.conf 로 교체한다(docs/DEPLOY.md 2단계).
#
# ⚠️ HTTP다. 로그인 쿠키가 평문으로 오간다. 동작 확인용이지 공개 서비스 상태가 아니다.

server {
    listen 80 default_server;
    # 도메인이 없으므로 어떤 Host로 와도 받는다(EC2 퍼블릭 IP 접속).
    server_name _;

    # ⚠️ 업스트림을 변수로 넘기고 도커 내장 DNS를 매번 다시 묻는다.
    #
    # 예전에는 `upstream attacca_be { server be:8080; }` 였는데, nginx는 그 이름을
    # **기동 시 한 번만** IP로 해석한다. 배포로 be/fe 컨테이너가 재생성되면 새 IP를
    # 받는데 nginx는 죽은 IP를 계속 붙들어 502가 났다(2026-09-08 실제로 겪음).
    # 자동 배포에서는 매번 터지므로, 이름을 변수에 담아 요청마다 다시 해석하게 한다.
    # 127.0.0.11은 도커 컴포즈 네트워크의 내장 DNS다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $attacca_fe fe:3000;
    set $attacca_be be:8080;

    # 업로드 상한은 BE의 multipart 설정(10MB)과 맞춘다. 여기가 더 작으면
    # 스프링에 닿기도 전에 413으로 끊긴다.
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://$attacca_be;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # storage.type=local 일 때의 업로드 파일. S3로 전환하면 이 블록은 필요 없다.
    location /files/ {
        proxy_pass http://$attacca_be;
        proxy_set_header Host $host;
    }

    # WebSocket. Upgrade/Connection 헤더를 넘기지 않으면 STOMP 핸드셰이크가 실패한다.
    location /ws {
        proxy_pass http://$attacca_be;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 채팅은 오래 열려 있는다. 기본 60초로는 조용한 방이 끊긴다.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # 헬스체크는 밖에 열지 않는다. 서버 안에서만 확인한다.
    #   docker compose -f docker-compose.prod.yml exec be wget -qO- localhost:8080/actuator/health
    location = /actuator/health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://$attacca_be;
    }

    location / {
        proxy_pass http://$attacca_fe;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
