# Attaca 리버스 프록시 (단일 인스턴스 배포)
#
#   브라우저 ──> Nginx(443) ──┬──> FE(Next.js :3000)   기본
#                             ├──> BE(:8080) /api/**
#                             ├──> BE(:8080) /files/** (storage.type=local일 때)
#                             └──> BE(:8080) /ws       WebSocket 업그레이드
#
# FE의 BFF는 컨테이너 네트워크 안에서 BE를 직접 부르므로(BE_BASE_URL=http://be:8080)
# 브라우저가 /api/**를 직접 칠 일은 채팅 WS와 파일 서빙 정도다. 그래도 모바일 앱 등
# BE를 직접 호출하는 소비처를 대비해 열어 둔다.

upstream attaca_fe { server fe:3000; }
upstream attaca_be { server be:8080; }

server {
    listen 80;
    server_name ${SERVER_NAME};

    # certbot 갱신용 경로만 열어 두고 나머지는 HTTPS로 보낸다.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${SERVER_NAME};

    ssl_certificate     /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;

    # 업로드 상한은 BE의 multipart 설정(10MB)과 맞춘다. 여기가 더 작으면
    # 스프링에 닿기도 전에 413으로 끊긴다.
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://attaca_be;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # storage.type=local 일 때의 업로드 파일. S3로 전환하면 이 블록은 필요 없다.
    location /files/ {
        proxy_pass http://attaca_be;
        proxy_set_header Host $host;
    }

    # WebSocket. Upgrade/Connection 헤더를 넘기지 않으면 STOMP 핸드셰이크가 실패한다.
    location /ws {
        proxy_pass http://attaca_be;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 채팅은 오래 열려 있는다. 기본 60초로는 조용한 방이 끊긴다.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # 헬스체크는 외부에 열지 않는다. 필요하면 내부망/보안그룹에서만 접근하도록 둘 것.
    location = /actuator/health {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://attaca_be;
    }

    location / {
        proxy_pass http://attaca_fe;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
