# Attacca 리버스 프록시 — 2단계: 도메인 + HTTPS
#
# 1단계(deploy/nginx.conf, IP+HTTP)에서 동작을 확인한 뒤 이걸로 교체한다.
# 이 파일은 ${SERVER_NAME} 치환이 필요하므로 templates/ 로 마운트해야 한다:
#
#   volumes:
#     - ./deploy/nginx.https.conf:/etc/nginx/templates/default.conf.template:ro
#     - ./deploy/certbot/conf:/etc/letsencrypt:ro
#     - ./deploy/certbot/www:/var/www/certbot:ro
#   environment:
#     SERVER_NAME: ${SERVER_NAME}
#
# 교체 시 함께 바꿀 것 (docs/DEPLOY.md 2단계):
#   - PUBLIC_ORIGIN 을 https:// 로
#   - NEXT_PUBLIC_BE_WS_URL 을 wss:// 로  → FE 이미지 **재빌드** 필요(빌드 시점에 박힌다)
#   - 카카오 콘솔 Redirect URI 를 https 주소로


server {
    listen 80;
    server_name ${SERVER_NAME} www.${SERVER_NAME};

    # certbot 갱신용 경로만 열어 두고 나머지는 HTTPS로 보낸다.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${SERVER_NAME} www.${SERVER_NAME};

    # ⚠️ 업스트림 이름을 고정 upstream으로 두면 nginx가 기동 시 한 번만 해석해,
    # 배포로 be/fe가 재생성되면 죽은 IP를 붙들고 502를 낸다(1단계에서 실제로 겪음).
    # 변수로 넘겨 요청마다 도커 내장 DNS(127.0.0.11)에 다시 묻는다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $attacca_fe fe:3000;
    set $attacca_be be:8080;


    ssl_certificate     /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;

    client_max_body_size 10m;

    # ⚠️ 이 블록이 /api/ 보다 먼저 와야 한다(nginx는 가장 긴 접두사를 고른다).
    # BFF는 FE(Next.js)의 라우트다. 없으면 브라우저가 부른 /api/bff/* 가 전부
    # BE로 가 401이 나고 로그인·피드가 통째로 죽는다(1단계에서 실제로 겪음).
    location /api/bff/ {
        proxy_pass http://$attacca_fe;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://$attacca_be;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /files/ {
        proxy_pass http://$attacca_be;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://$attacca_be;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    location = /actuator/health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://$attacca_be;
    }

    location / {
        proxy_pass http://$attacca_fe;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
