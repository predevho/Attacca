name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 코드는 그대로인데 이미지를 다시 구워야 할 때가 있다.
  # 예: NEXT_PUBLIC_BE_WS_URL 같은 빌드 시점 변수만 바뀐 경우 —
  # 그 값은 번들에 박히므로 변수만 고쳐서는 아무 일도 일어나지 않는다.
  # Actions 탭에서 "Run workflow"로 부른다.
  workflow_dispatch:

# 모노레포지만 워크플로 파일을 나누지 않는다.
# 파일을 나누면 BE와 FE가 같이 바뀐 커밋에서 실행 순서가 보장되지 않아,
# API 계약이 바뀐 배포 때 깨진 창이 생긴다. 한 워크플로 안에서 job 단위로 감지하고
# needs로 순서를 강제한다.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      be: ${{ steps.filter.outputs.be }}
      fe: ${{ steps.filter.outputs.fe }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            be:
              - 'BE/**'
              - '.github/workflows/ci.yml'
            fe:
              - 'FE/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.be == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          # JDK 21 고정. Gradle 8.11.1은 JDK 25에서 Kotlin DSL 컴파일에 실패한다.
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      # 테스트는 H2 test 프로파일에서 돈다. MySQL 서비스 컨테이너가 필요 없다.
      - run: ./gradlew test
        working-directory: BE

  frontend:
    needs: [changes, backend]
    # backend를 건너뛰었어도(BE 변경 없음) FE는 돌아야 한다.
    if: >-
      always() && needs.backend.result != 'failure'
      && (needs.changes.outputs.fe == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
        working-directory: FE
      - run: npm test
        working-directory: FE
      - run: npx eslint
        working-directory: FE
      - run: npm run check:colors
        working-directory: FE
      - run: npm run build
        working-directory: FE

  # 이미지를 여기서 굽고 GHCR에 올린다. 서버는 받아 쓰기만 한다.
  #
  # 왜 서버에서 안 굽는가: t3.micro(1GB)에서 Gradle과 Next를 빌드하면 스왑을 긁으며
  # 오래 걸리고, 빌드 캐시가 5GB까지 불어나 디스크를 먹었다. 빌드를 밖으로 빼면
  # 서버가 할 일은 pull과 컨테이너 교체뿐이다.
  #
  # 배포 트리거는 여기 없다. 서버의 systemd 타이머가 2분마다 새 이미지를 확인하고
  # 스스로 갱신한다(deploy/update.sh). 그래서 EC2에 인바운드 포트를 하나도
  # 열지 않아도 되고, GitHub에 서버 자격증명을 두지 않아도 된다.
  images:
    needs: [changes, backend, frontend]
    # 문서만 바뀐 커밋은 굽지 않는다. 한쪽만 바뀌었어도 **둘 다** 굽는다 —
    # `latest` 두 개가 항상 같은 커밋을 가리켜야 API 계약이 바뀐 배포에서
    # BE 신버전 + FE 구버전 같은 조합이 생기지 않는다(위 changes job 주석과 같은 이유).
    if: >-
      always()
      && needs.backend.result != 'failure' && needs.frontend.result != 'failure'
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push' && github.ref == 'refs/heads/main'
              && (needs.changes.outputs.be == 'true' || needs.changes.outputs.fe == 'true')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: be
            context: ./BE
          - name: fe
            context: ./FE
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # latest는 타이머가 보는 태그, sha는 어떤 커밋이 떠 있는지 되짚기 위한 것.
          tags: |
            ghcr.io/${{ github.repository_owner }}/attacca-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/attacca-${{ matrix.name }}:${{ github.sha }}
          # NEXT_PUBLIC_*은 번들에 박히므로 굽는 시점에 넣어야 한다. BE는 이 값을 무시한다.
          # 접속 주소가 바뀌면 저장소 Variables의 NEXT_PUBLIC_BE_WS_URL을 고칠 것.
          build-args: |
            NEXT_PUBLIC_BE_WS_URL=${{ vars.NEXT_PUBLIC_BE_WS_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # 커밋마다 :<sha> 태그가 생기는데 지우는 장치가 없으면 무한히 쌓인다.
      # 최근 10개만 남긴다 — 되짚거나 롤백할 만한 범위는 그 정도면 충분하고,
      # :latest 는 항상 최신이라 삭제 대상에 들지 않는다.
      - uses: actions/delete-package-versions@v5
        continue-on-error: true   # 정리에 실패했다고 배포를 막지는 않는다
        with:
          package-name: attacca-${{ matrix.name }}
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
