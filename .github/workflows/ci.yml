name: CI

on:
  push:
    branches: [main]
  pull_request:

# 모노레포지만 워크플로 파일을 나누지 않는다.
# 파일을 나누면 BE와 FE가 같이 바뀐 커밋에서 실행 순서가 보장되지 않아,
# API 계약이 바뀐 배포 때 깨진 창이 생긴다. 한 워크플로 안에서 job 단위로 감지하고
# needs로 순서를 강제한다.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      be: ${{ steps.filter.outputs.be }}
      fe: ${{ steps.filter.outputs.fe }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            be:
              - 'BE/**'
              - '.github/workflows/ci.yml'
            fe:
              - 'FE/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.be == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          # JDK 21 고정. Gradle 8.11.1은 JDK 25에서 Kotlin DSL 컴파일에 실패한다.
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      # 테스트는 H2 test 프로파일에서 돈다. MySQL 서비스 컨테이너가 필요 없다.
      - run: ./gradlew test
        working-directory: BE

  frontend:
    needs: [changes, backend]
    # backend를 건너뛰었어도(BE 변경 없음) FE는 돌아야 한다.
    if: always() && needs.changes.outputs.fe == 'true' && needs.backend.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
        working-directory: FE
      - run: npm test
        working-directory: FE
      - run: npx eslint
        working-directory: FE
      - run: npm run check:colors
        working-directory: FE
      - run: npm run build
        working-directory: FE

# 배포 job은 아직 없다. EC2 접속 방식(SSH 키 / SSM / ECR)이 정해지면
# frontend 다음에 needs로 붙인다 — docs/DEPLOY.md "아직 안 한 것" 참고.
