# 테스트 전역 오버라이드.
#
# 파일명이 application.yaml과 다르므로 메인 설정을 가리지 않고 함께 로드되며,
# 겹치는 키는 이쪽이 이긴다. (같은 이름이면 메인 application.yaml이 통째로 가려져
# jwt.secret 같은 설정까지 사라진다 — 그래서 .properties로 둔다.)
#
# 마이그레이션은 MySQL 문법이라 H2에서 돌지 않는다. @DataJpaTest는 프로파일을 지정하지 않고도
# 임베디드 DB를 쓰므로, 프로파일이 아니라 여기서 전역으로 꺼야 한다.
# 테스트가 검증하는 것은 엔티티 매핑이지 마이그레이션 스크립트가 아니다.
spring.flyway.enabled=false

# 스키마는 매 테스트마다 H2에 새로 만든다.
# 메인 설정의 ddl-auto가 validate로 내려가면서(운영 DB를 Hibernate가 못 바꾸게) 필요해졌다 —
# @DataJpaTest는 프로파일을 지정하지 않으므로 메인 값을 그대로 받는데, H2엔 스키마가 없어
# validate가 곧바로 실패한다.
spring.jpa.hibernate.ddl-auto=create-drop

# refresh 화이트리스트를 인메모리로. 테스트에 Redis를 띄우지 않기 위함이며,
# 저장소를 인터페이스로 둔 이유이기도 하다(DOMAIN-COMMON-STATUTE §4.1).
app.auth.token-store=memory
# Redis 자동설정도 꺼 둔다. 연결은 지연 생성이라 없어도 뜨지만, 테스트가
# 외부 인프라를 조금도 전제하지 않게 명시적으로 배제한다.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
