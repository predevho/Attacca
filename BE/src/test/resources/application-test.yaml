spring:
  datasource:
    url: jdbc:h2:mem:attacca-test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      # 테스트는 H2에 매번 새 스키마를 만든다. 운영 스키마 관리(Flyway)와는 별개다.
      ddl-auto: create-drop
  flyway:
    # 마이그레이션은 MySQL 문법으로 쓰여 있어 H2에서 돌지 않는다.
    # 테스트가 검증하는 것은 엔티티 매핑이지 마이그레이션 스크립트가 아니다.
    enabled: false

storage:
  local:
    root-dir: build/test-uploads
